/* Оригинальный учебный банк заданий. Не является копией Решу ОГЭ или ФИПИ. */

};
const POSITIONS = [
 [1,'Величины и единицы',2,'Б'],[2,'Физические приборы',2,'Б'],[3,'Распознавание явлений',1,'Б'],
 [4,'Описание явлений',2,'Б'],[5,'Объяснение явлений',1,'Б'],[6,'Расчёты: механика',1,'Б'],
 [7,'Расчёты: механика и волны',1,'Б'],[8,'Расчёты: тепловые явления',1,'Б'],
 [9,'Расчёты: электричество',1,'Б'],[10,'Электрические цепи',1,'Б'],[11,'Ядерная физика',1,'Б'],
 [12,'Изменение физических величин',2,'Б'],[13,'Изменение величин и оптика',2,'Б'],
 [14,'Анализ графиков и таблиц',2,'П'],[15,'Измерительные приборы',1,'Б'],
 [16,'Анализ результатов опытов',2,'П'],[17,'Лабораторная работа',3,'В'],
 [18,'Физический текст',2,'П'],[19,'Качественная задача',2,'П'],
 [20,'Расчётная задача',3,'П'],[21,'Сложная расчётная задача',3,'В'],[22,'Комбинированная задача',3,'В']
].map(([num,name,points,level])=>({num,name,points,level}));
const QUESTIONS=[];
function add(pos,topic,kind,prompt,answer,options,hint,solution,extra={}){
 const count=QUESTIONS.filter(q=>q.pos===pos).length+1;
 QUESTIONS.push({id:`p${String(pos).padStart(2,'0')}-${count}`,pos,topic,kind,prompt,answer:answer==null?'':String(answer),options:options||[],hint:hint||'',solution:solution||'',...extra});
}
// № 1. Соотнесение величин и единиц измерения.
add(1,'methods','sequence','Установите соответствие: А) сила; Б) энергия; В) давление. В ответе запишите три цифры по порядку АБВ.','123',['1 — Н','2 — Дж','3 — Па','4 — Вт','5 — Кл'],'Вспомни определения ньютона, джоуля и паскаля.','Сила измеряется в ньютонах (1), энергия — в джоулях (2), давление — в паскалях (3).');
add(1,'thermal','sequence','Сопоставьте величины: А) удельная теплоёмкость; Б) количество теплоты; В) мощность. Запишите АБВ.','312',['1 — Дж','2 — Вт','3 — Дж/(кг·°C)','4 — кг','5 — Н'],'Единицу можно вывести из формулы Q = cmΔt.','Удельная теплоёмкость — Дж/(кг·°C) (3); количество теплоты — Дж (1); мощность — Вт (2).');
add(1,'mechanics','sequence','Соотнесите: А) ускорение; Б) плотность; В) частота колебаний. Запишите АБВ.','321',['1 — Гц','2 — кг/м³','3 — м/с²','4 — Н'],'Частота показывает число колебаний в секунду.','Ускорение измеряется в м/с² (3), плотность — кг/м³ (2), частота — Гц (1).');
// № 2. Принцип действия технических устройств.
add(2,'electricity','sequence','Установите соответствие: А) электродвигатель; Б) солнечная батарея. Запишите АБ.','12',['1 — действие магнитного поля на проводник с током','2 — преобразование энергии света в электрическую','3 — тепловое расширение жидкости','4 — испарение жидкости'],'Подумай, какую энергию получает и какую отдаёт прибор.','В двигателе взаимодействуют ток и магнитное поле (1). Солнечный элемент превращает свет в электрическую энергию (2).');
add(2,'thermal','sequence','Какое явление используется в приборах: А) жидкостный термометр; Б) электрогенератор? Запишите АБ.','31',['1 — электромагнитная индукция','2 — преломление света','3 — тепловое расширение жидкости','4 — диффузия'],'Генератор работает при изменении магнитного потока.','Термометр основан на тепловом расширении (3), генератор — на электромагнитной индукции (1).');
add(2,'optics','sequence','Установите соответствие: А) собирающая линза; Б) плавкий предохранитель. Запишите АБ.','12',['1 — преломление света','2 — тепловое действие электрического тока','3 — конвекция','4 — отражение звука'],'Для линзы важна граница двух оптических сред.','Линза преломляет свет (1). Предохранитель плавится от нагрева током (2).');
// № 3. Определение физического явления.
add(3,'thermal','choice','Солнце прогревает асфальт даже в безветренную погоду. Каким способом энергия поступает от Солнца к Земле?','2',['Теплопроводностью','Излучением','Конвекцией воздуха','Диффузией'],'Между Солнцем и Землёй почти вакуум.','Электромагнитное излучение распространяется и в вакууме.');
add(3,'mechanics','choice','На резком повороте пассажир автомобиля наклоняется относительно салона в сторону, противоположную повороту. Что объясняет это наблюдение?','1',['Инерция','Диффузия','Электромагнитная индукция','Испарение'],'Тело стремится сохранять прежнюю скорость.','Инерция — сохранение скорости тела при отсутствии равнодействующей силы.');
add(3,'optics','choice','Ложка в стакане воды кажется «сломленной» у поверхности. Какое явление это объясняет?','3',['Отражение света','Дисперсия','Преломление света','Конвекция'],'Луч изменяет направление при переходе между средами.','Свет преломляется на границе воды и воздуха.');
// № 4. Восстановление научного текста.
add(4,'thermal','sequence','Заполните пропуски: «Пар, находящийся в динамическом равновесии со своей жидкостью, называется (А). Отношение фактического давления пара к давлению насыщенного пара при той же температуре называют (Б) влажностью. Переход пара в жидкость — (В)». Ответ: АБВ.','123',['1 — насыщенным','2 — относительной','3 — конденсацией','4 — испарением','5 — абсолютной'],'Сравни испарение с обратным процессом.','А — насыщенным (1); Б — относительной (2); В — конденсацией (3).');
add(4,'electricity','sequence','Вставьте термины: «Упорядоченное движение заряженных частиц — электрический (А). Прибор для измерения силы тока — (Б), а для измерения напряжения — (В)». Ответ АБВ.','241',['1 — вольтметр','2 — ток','3 — омметр','4 — амперметр','5 — заряд'],'Вспомни, какие величины измеряют в амперах и вольтах.','Ток (2), амперметр (4), вольтметр (1).');
add(4,'optics','sequence','Дополните: «Угол падения измеряют между падающим лучом и (А) к поверхности. По закону отражения угол отражения (Б) углу падения. При переходе из воздуха в стекло скорость света (В)». Ответ АБВ.','132',['1 — нормалью','2 — уменьшается','3 — равен','4 — больше','5 — касательной'],'Скорость света в стекле меньше скорости света в воздухе.','Угол измеряют относительно нормали (1); углы равны (3); в стекле свет движется медленнее (2).');
// № 5. Качественные тесты на физические закономерности.
add(5,'mechanics','choice','На дне бассейна две точки находятся на разной глубине. В какой из них гидростатическое давление воды больше?','2',['На меньшей глубине','На большей глубине','Одинаково при любой глубине','Зависит только от площади дна'],'Запиши p = ρgh.','При одинаковой жидкости давление p = ρgh увеличивается с глубиной h.');
add(5,'electricity','choice','Два одинаковых резистора соединены последовательно. Как изменится общее сопротивление цепи, если добавить третий такой же резистор последовательно?','1',['Увеличится','Уменьшится','Не изменится','Станет равным нулю'],'При последовательном соединении сопротивления складывают.','Rобщ = R₁ + R₂ + R₃, поэтому сопротивление увеличится.');
add(5,'thermal','choice','В закрытом термосе есть блестящая внутренняя поверхность. Какое тепловое взаимодействие она прежде всего уменьшает?','3',['Испарение','Диффузию','Передачу энергии излучением','Теплопроводность металла'],'Зеркальная поверхность отражает электромагнитные волны.','Блестящая поверхность хорошо отражает инфракрасное излучение.');
// № 6. Простые вычисления.
add(6,'mechanics','number','Велосипедист проехал 150 м за 30 с с постоянной скоростью. Найдите скорость в м/с.','5',[],'Скорость равна пути, делённому на время.','v = s/t = 150/30 = 5 м/с.',{unit:'м/с'});
add(6,'mechanics','number','На тело массой 2 кг действует равнодействующая сила, сообщающая ускорение 3 м/с². Найдите силу в ньютонах.','6',[],'Второй закон Ньютона: F = ma.','F = 2 × 3 = 6 Н.',{unit:'Н'});
add(6,'mechanics','number','Скорость тела равномерно возросла с 2 до 14 м/с за 4 с. Найдите ускорение в м/с².','3',[],'Ускорение равно изменению скорости за единицу времени.','a = (14 − 2)/4 = 3 м/с².',{unit:'м/с²'});
// № 7. Волны, колебания, простые механизмы.
add(7,'mechanics','number','Звуковая волна распространяется со скоростью 340 м/с. Длина волны 0,5 м. Найдите частоту в герцах.','680',[],'v = λν.','ν = v/λ = 340/0,5 = 680 Гц.',{unit:'Гц'});
add(7,'mechanics','number','Период колебаний маятника 0,02 с. Найдите частоту в герцах.','50',[],'Частота — величина, обратная периоду.','ν = 1/T = 1/0,02 = 50 Гц.',{unit:'Гц'});
add(7,'mechanics','number','Слева от опоры рычага сила 15 Н приложена на расстоянии 40 см. На каком значении силы справа на расстоянии 20 см рычаг будет в равновесии? Ответ в Н.','30',[],'Моменты сил при равновесии одинаковы.','15 × 0,4 = F × 0,2, следовательно F = 30 Н.',{unit:'Н'});
// № 8. Тепловые расчёты.
add(8,'thermal','number','Сколько килоджоулей требуется, чтобы нагреть 2 кг воды на 10 °C? Удельная теплоёмкость воды 4200 Дж/(кг·°C).','84',[],'Q = cmΔt. Не забудь перевести джоули в килоджоули.','Q = 4200 × 2 × 10 = 84 000 Дж = 84 кДж.',{unit:'кДж'});
add(8,'thermal','number','Какое количество теплоты в кДж нужно для плавления 0,5 кг льда при температуре плавления? λ = 330 кДж/кг.','165',[],'При плавлении Q = λm.','Q = 330 × 0,5 = 165 кДж.',{unit:'кДж'});
add(8,'thermal','number','Нагревают алюминиевую деталь массой 0,4 кг на 25 °C. Удельная теплоёмкость алюминия 900 Дж/(кг·°C). Сколько джоулей получит деталь?','9000',[],'Перемножь c, m и Δt.','Q = 900 × 0,4 × 25 = 9000 Дж.',{unit:'Дж'});
// № 9. Электричество и заряд.
add(9,'electricity','number','Два одинаковых металлических шара с зарядами +10 нКл и −2 нКл соединяют проводником. Каким станет заряд каждого шара? Ответ в нКл.','4',[],'Полный заряд сохраняется и делится поровну.','q = (10 − 2)/2 = 4 нКл.',{unit:'нКл'});
add(9,'electricity','number','Через поперечное сечение проводника за 6 секунд прошёл заряд 24 Кл. Найдите силу тока в амперах.','4',[],'I = q/t.','I = 24/6 = 4 А.',{unit:'А'});
add(9,'electricity','number','При напряжении 12 В по прибору течёт ток 2 А в течение 10 с. Найдите работу тока в джоулях.','240',[],'A = UIt.','A = 12 × 2 × 10 = 240 Дж.',{unit:'Дж'});

add(10,'electricity','number','На резисторе напряжение 12 В, сила тока 3 А. Определите его сопротивление в омах.','4',[],'Закон Ома: R = U/I.','R = 12/3 = 4 Ом.',{unit:'Ом'});

// № 11. Ядерная физика.
add(11,'atomic','number','Ядро натрия имеет массовое число 23 и зарядовое число 11. Сколько нейтронов содержится в ядре?','12',[],'A = Z + N.','N = A − Z = 23 − 11 = 12.',{unit:'нейтронов'});
add(11,'atomic','number','При альфа-распаде урана-238 (Z = 92) образуется ядро тория. Сколько нейтронов в образовавшемся ядре?','144',[],'Альфа-частица уносит A = 4 и Z = 2.','Торий: A = 238 − 4 = 234; Z = 92 − 2 = 90; N = 234 − 90 = 144.',{unit:'нейтронов'});
add(11,'atomic','number','При β⁻-распаде углерода-14 образуется азот-14 (Z = 7). Сколько нейтронов в новом ядре?','7',[],'При β⁻-распаде массовое число остаётся прежним.','N = A − Z = 14 − 7 = 7.',{unit:'нейтронов'});
// № 12. Изменения величин.
add(12,'mechanics','sequence','Вода в сосуде покоится. Точку наблюдения перемещают глубже. Как изменятся: А) гидростатическое давление; Б) плотность воды? Ответ АБ.','13',['1 — увеличится','2 — уменьшится','3 — не изменится'],'Для одной и той же жидкости ρ постоянно.','p = ρgh возрастает, плотность остаётся прежней: 13.');
add(12,'mechanics','sequence','Одно и то же тело начинает двигаться быстрее. Как изменятся: А) импульс тела по модулю; Б) масса тела? Ответ АБ.','13',['1 — увеличится','2 — уменьшится','3 — не изменится'],'Импульс p = mv.','Скорость растёт → импульс растёт (1), масса остаётся той же (3).');
add(12,'mechanics','sequence','Длину математического маятника увеличили при неизменном g и малых колебаниях. Как изменятся: А) период; Б) частота? Ответ АБ.','12',['1 — увеличится','2 — уменьшится','3 — не изменится'],'T = 2π√(l/g), ν = 1/T.','Период возрастёт (1), а частота уменьшится (2).');
// № 13. Зависимость величин.
add(13,'optics','sequence','Человек переводит взгляд с близкой книги на далёкий дом. Как изменятся: А) фокусное расстояние хрусталика; Б) его оптическая сила? Ответ АБ.','12',['1 — увеличится','2 — уменьшится','3 — не изменится'],'D = 1/f; при взгляде вдаль хрусталик становится более плоским.','Фокусное расстояние возрастает (1), оптическая сила уменьшается (2).');
add(13,'electricity','sequence','Напряжение источника поддерживают постоянным. Сопротивление единственного резистора увеличивают. Как изменятся: А) сила тока; Б) мощность на резисторе? Ответ АБ.','22',['1 — увеличится','2 — уменьшится','3 — не изменится'],'I = U/R, P = U²/R.','При постоянном U обе величины уменьшатся: 22.');
add(13,'optics','sequence','Оптическую силу собирающей линзы увеличили. Как изменятся: А) её фокусное расстояние; Б) скорость света в неизменном материале линзы? Ответ АБ.','23',['1 — увеличится','2 — уменьшится','3 — не изменится'],'D = 1/f. Скорость света зависит от среды.','Фокусное расстояние уменьшается (2); скорость света в том же веществе не изменяется (3).');
// № 14. Анализ графиков, таблиц, схем. Выберите два верных утверждения.
add(14,'mechanics','multi','График координаты равномерно движущегося тела: точки (0 с; 0 м), (1 с; 4 м), (2 с; 8 м), (3 с; 12 м). Выберите ДВА верных утверждения.','13',['Скорость тела равна 4 м/с.','За 3 с тело прошло 8 м.','Координата в момент 2 с равна 8 м.','Ускорение равно 4 м/с².','Тело поменяло направление движения.'],'Наклон графика x(t) определяет скорость.','Наклон равен 4 м/с — утверждение 1 верно. При t = 2 координата 8 м — 3 верно. За 3 с тело прошло 12 м, ускорение равно 0.',{visual:'graph-motion'});
add(14,'thermal','multi','На графике нагревания вещества температура растёт от 20 до 60 °C за первые 4 минуты, а с 4-й до 8-й минуты остаётся 60 °C. Нагрев продолжается. Выберите ДВА верных утверждения.','13',['С 4-й по 8-ю минуту температура постоянна.','На горизонтальном участке энергия к веществу не поступает.','Горизонтальный участок может соответствовать плавлению чистого вещества.','В момент 4 минуты температура скачкообразно уменьшается.','На горизонтальном участке масса обязательно удваивается.'],'При фазовом переходе температура чистого вещества может оставаться постоянной.','1 — верно по графику; 3 — верно для плавления при постоянном давлении. Подводимая энергия расходуется на изменение агрегатного состояния.',{visual:'graph-heat'});
add(14,'electricity','multi','Измерили ток при разном напряжении на одном резисторе: U = 2, 4, 6, 8 В; I = 0,5; 1; 1,5; 2 А. Выберите ДВА верных утверждения.','14',['Сопротивление равно 4 Ом.','При U = 6 В ток равен 2 А.','При удвоении напряжения ток уменьшается вдвое.','Сила тока прямо пропорциональна напряжению.','Сопротивление резистора возрастает с напряжением.'],'Проверь отношение U/I в каждом столбце.','R = U/I = 2/0,5 = 4 Ом (1); отношение I/U постоянно, значит I ∝ U (4).',{visual:'table-ohm'});
// № 15. Прямые измерения.
add(15,'methods','choice','У линейки от отметки 0 до отметки 5 см — 25 одинаковых маленьких делений. Чему равны цена одного деления и предел измерения этого участка?','2',['0,5 см и 5 см','0,2 см и 5 см','0,2 см и 25 см','5 см и 0,2 см'],'Цена деления — диапазон, делённый на число интервалов.','5 см / 25 = 0,2 см. Конечное значение шкалы — 5 см.',{visual:'ruler'});
add(15,'methods','choice','Шкала амперметра равномерно размечена от 0 до 2 А и содержит 10 промежутков. Найдите цену деления и предел измерения.','1',['0,2 А и 2 А','2 А и 0,2 А','0,1 А и 10 А','0,5 А и 2 А'],'Подели диапазон шкалы на число промежутков, не отметок.','2 / 10 = 0,2 А. Предел измерения — 2 А.',{visual:'ammeter'});
add(15,'methods','choice','Равномерная шкала термометра от −10 до +50 °C состоит из 12 интервалов. Какова цена деления?','3',['2 °C','4 °C','5 °C','10 °C'],'Полный диапазон температур равен 60 °C.','(50 − (−10)) / 12 = 5 °C.',{visual:'thermometer'});
// № 16. Интерпретация опыта.
add(16,'methods','multi','Для пружины измерили зависимость длины от силы: F = 0, 1, 2, 3 Н; l = 10, 12, 14, 16 см. Выберите ДВА верных утверждения.','14',['При увеличении силы на 1 Н пружина удлиняется на 2 см.','Жёсткость пружины составляет 2 Н/м.','При F = 0 длина пружины равна 0 см.','Жёсткость пружины равна 50 Н/м.','При F = 2 Н удлинение равно 14 см.'],'Жёсткость k = F/Δl, удлинение измеряют относительно начальной длины.','1 верно: при +1 Н длина растёт на 2 см. k = 1/0,02 = 50 Н/м: 4 верно.',{visual:'table-spring'});
add(16,'mechanics','multi','В опыте для математических маятников получили: l₁ = 0,25 м, T₁ = 1 с; l₂ = 1 м, T₂ = 2 с. Выберите ДВА верных утверждения.','25',['Период первого маятника равен 2 с.','Частота первого маятника равна 1 Гц.','Частота второго маятника равна 2 Гц.','Период уменьшается с увеличением длины.','Частота второго маятника равна 0,5 Гц.'],'ν = 1/T.','У первого маятника ν₁ = 1 Гц (2), у второго ν₂ = 0,5 Гц (5).',{visual:'table-pendulum'});
add(16,'methods','multi','Для двух металлических образцов одного материала измерили: первый — масса 30 г, объём 10 см³; второй — масса 60 г, объём 20 см³. Выберите ДВА верных утверждения.','13',['Плотность первого образца равна 3 г/см³.','Плотность второго образца вдвое больше.','Плотности образцов одинаковы.','Объём первого образца равен 30 см³.','Масса первого образца больше массы второго.'],'Используй ρ = m/V для каждого образца.','ρ₁ = 30/10 = 3, ρ₂ = 60/20 = 3 г/см³, поэтому верны 1 и 3.',{visual:'table-density'});
// № 17. Экспериментальные задания. На реальном ОГЭ нужны приборы.
add(17,'methods','written','Практическая работа: нужно определить плотность металлического цилиндра. Весы показали m = (72,0 ± 0,1) г. Уровень воды в мензурке поднялся с 40 до 64 см³, абсолютная погрешность измерения объёма цилиндра ±2 см³. Опишите установку, запишите измерения, формулу и плотность в г/см³.','',[''], 'Вытесненный объём воды равен объёму погружённого тела.','1) Взвесить цилиндр. 2) Опустить в мензурку с водой полностью и отметить изменение объёма: V = (24 ± 2) см³. 3) ρ = m/V = 72/24 = 3 г/см³. Для полноценного экзамена нужен рисунок установки и реальные измерения.',{criteria:['Есть схема или корректное описание установки с мензуркой и весами.','Результаты измерений записаны с единицами и указанными погрешностями.','Приведена формула ρ = m/V и верный результат 3 г/см³.']});
add(17,'methods','written','Практическая работа: по показанию динамометра сила упругости пружины составляет 2 Н, удлинение относительно ненагруженного состояния — 4 см. Опишите, как определить коэффициент жёсткости пружины, и вычислите его в Н/м.','',[],'Переведи 4 см в метры. Используй закон Гука.','Зафиксировать пружину, измерить исходную и конечную длины линейкой, измерить силу динамометром. Δl = 0,04 м; k = F/Δl = 2/0,04 = 50 Н/м. На экзамене отражают результаты реальных измерений.',{criteria:['Описаны пружина, линейка, динамометр и метод измерения.','Записана формула F = kΔl и корректно переведена длина в СИ.','Получено k = 50 Н/м, указана единица.']});
add(17,'electricity','written','Практическая работа: в опыте с резистором получили показания (U; I): (2 В; 0,2 А), (4 В; 0,4 А), (6 В; 0,6 А). Изобразите или опишите схему измерения, вычислите сопротивление и сделайте вывод о его зависимости от напряжения.','',[],'Вольтметр включают параллельно резистору, амперметр — последовательно.','Амперметр подключён последовательно, вольтметр — параллельно резистору. R = U/I: 2/0,2 = 4/0,4 = 6/0,6 = 10 Ом. В условиях опыта сопротивление постоянно. Реальные измерения на экзамене выполняются с лабораторным комплектом.',{criteria:['Описана верная схема подключения амперметра и вольтметра.','Приведены измерения, формула R = U/I и вычисление 10 Ом.','Сделан вывод о постоянстве сопротивления на этих данных.']});
// № 18. Работа с физическим текстом.
add(18,'thermal','written','Прочитайте описание: «Термос имеет две стенки, между которыми создано разреженное пространство. Внутренние поверхности покрыты отражающим слоем». Объясните, как оба конструктивных решения уменьшают теплообмен.','',[],'Назови разные способы теплопередачи.','Разреженное пространство сильно затрудняет теплопроводность и конвекцию между стенками. Отражающий слой уменьшает обмен энергией излучением.',{criteria:['Объяснена роль разреженного пространства в уменьшении теплопроводности и конвекции.','Объяснено уменьшение теплопередачи излучением за счёт отражающей поверхности.']});
add(18,'mechanics','written','Прочитайте: «После вспышки молнии наблюдатель услышал гром спустя 4 секунды. Скорость звука в воздухе примерно 340 м/с, распространение света можно считать мгновенным». Оцените расстояние до грозы и объясните расчёт.','',[],'Расстояние равно скорости звука, умноженной на время задержки.','s = vt = 340 × 4 = 1360 м ≈ 1,36 км. Задержкой распространения света пренебрегаем.',{criteria:['Правильно указано, почему задержка обусловлена распространением звука.','Записан расчёт s = 1360 м (1,36 км) с единицей.']});
add(18,'electricity','written','Прочитайте: «Солнечная панель преобразует часть энергии падающего солнечного света в электрическую. В пасмурную погоду поток света уменьшается». При одинаковой панели объясните, что произойдёт с её электрической мощностью и почему.','',[],'Сколько энергии поступает за одну секунду?','При уменьшении потока падающей солнечной энергии электрическая мощность панели обычно снижается, поскольку при прочих равных за единицу времени поступает меньше энергии для преобразования.',{criteria:['Указано уменьшение выдаваемой мощности панели.','Дана причинная связь с уменьшением энергии света, поступающей за единицу времени.']});
// № 19. Качественная задача.
add(19,'thermal','written','Металлическая ложка долго находится в чашке горячего чая, и её ручка нагревается. Каким способом энергия дошла до ручки и почему металлическая ложка нагревается быстрее деревянной?','',[],'Тепло переносится вдоль самого предмета без переноса вещества на большие расстояния.','Теплопроводность переносит энергию от горячей части ложки к холодной. У металлов теплопроводность обычно намного выше, чем у дерева.',{criteria:['Правильно названо явление теплопроводности.','Объяснено различие металла и дерева по теплопроводности.']});
add(19,'mechanics','written','Надутый воздухом лёгкий пластиковый мяч погрузили в воду и отпустили. Почему он всплывает? Ответ обоснуйте с использованием действующих сил.','',[],'Сравни силу Архимеда и силу тяжести.','На погружённый мяч действует направленная вверх выталкивающая сила Архимеда. Она больше силы тяжести мяча, поэтому равнодействующая направлена вверх и мяч всплывает.',{criteria:['Названа выталкивающая сила Архимеда и её направление.','Указано условие F_A > mg и объяснено всплытие.']});
add(19,'optics','written','Глядя из воздуха на камешек под водой, человек часто воспринимает его ближе к поверхности, чем он находится на самом деле. Какое явление вызывает эту ошибку? Объясните ход лучей.','',[],'Световые лучи меняют направление на границе сред.','Из-за преломления света на границе воды и воздуха лучи отклоняются от нормали. Глаз мысленно продолжает их прямолинейно назад и видит мнимое изображение камешка выше его истинного положения.',{criteria:['Правильно названо преломление света.','Объяснено построение кажущегося положения камешка из продолжения преломлённых лучей.']});
// № 20. Расчётные задачи повышенного уровня.
add(20,'electricity','written','К источнику напряжения 12 В параллельно подключили резисторы 6 Ом и 3 Ом. Найдите общую силу тока и полную мощность, потребляемую цепью.','',[],'На каждом параллельном резисторе одинаковое напряжение.','I₁ = 12/6 = 2 А, I₂ = 12/3 = 4 А, Iобщ = 6 А. P = UI = 12 × 6 = 72 Вт.',{criteria:['Верно использованы законы Ома и параллельного соединения.','Получена общая сила тока 6 А.','Получена полная мощность 72 Вт с единицей.']});
add(20,'thermal','written','Воду массой 0,5 кг нагрели с 20 до 80 °C. Удельная теплоёмкость воды 4200 Дж/(кг·°C). Определите переданное ей количество теплоты в килоджоулях, пренебрегая потерями.','',[],'Q = cm(t₂ − t₁).','Δt = 60 °C. Q = 4200 × 0,5 × 60 = 126 000 Дж = 126 кДж.',{criteria:['Верно вычислена разность температур 60 °C.','Применена формула Q = cmΔt с подстановкой данных.','Получен ответ 126 кДж с правильной единицей.']});
add(20,'mechanics','written','Подъёмник перемещает груз массой 50 кг вертикально вверх на 3 м. КПД подъёмника 75 %. Примите g = 10 Н/кг. Сколько энергии потребил подъёмник?','',[],'Полезная работа Aп = mgh, η = Aп/Aз.','Aпол = 50 × 10 × 3 = 1500 Дж. Aзат = Aпол/0,75 = 2000 Дж.',{criteria:['Вычислена полезная работа mgh = 1500 Дж.','КПД записан в долях единицы: 0,75.','Верно рассчитана затраченная энергия 2000 Дж.']});
// № 21. Сложные задачи.

  <script>
(() => {
'use strict';
const KEY='physics-oge-studio-v1';
const EXAM_SECONDS=180*60;
const MS_DAY=86400000;
const DEFAULT=()=>({name:'Ученик',goal:10,attempts:[],sessions:[],reviews:{},active:null,lastResult:null,created:Date.now()});
const safe=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=safe;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.attempts)&&Array.isArray(v.sessions))return {...DEFAULT(),...v,reviews:v.reviews||{}};}catch(e){}return DEFAULT()}
let db=load();
const ui={page:location.hash.replace('#','')||'dashboard',topic:'all',position:'all',count:'10',search:'',learnTopic:'mechanics',solutionOpen:{},analyticsFilter:'all',toastTimer:null};
const app=document.querySelector('#app');
const QBYID=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const POS=Object.fromEntries(POSITIONS.map(p=>[p.num,p]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){notify('Не получилось сохранить: в браузере нет свободного места или запрещено хранилище.')}}
const icons={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
 chart:'<path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/>',
 settings:'<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19 13.5a7.5 7.5 0 0 0 0-3l2-1.6-2-3.4-2.4.8a8 8 0 0 0-2.6-1.5L13.5 2h-4l-.5 2.8a8 8 0 0 0-2.6 1.5L4 5.5 2 8.9 4 10.5a7.5 7.5 0 0 0 0 3L2 15.1l2 3.4 2.4-.8A8 8 0 0 0 9 19.2l.5 2.8h4l.5-2.8a8 8 0 0 0 2.6-1.5l2.4.8 2-3.4z"/>',
 arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
 back:'<path d="M19 12H5m6-6-6 6 6 6"/>',
 check:'<path d="m5 12 5 5L20 7"/>',
 fire:'<path d="M12 22c4 0 7-3 7-7 0-3-2-5-3-6 0 3-2 4-2 4 1-5-2-9-5-11 0 4-4 7-4 13a7 7 0 0 0 7 7z"/>',
 spark:'<path d="m12 2 1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6zM19 17l.5 2 2 .5-2 .5-.5 2-.5-2-2-.5 2-.5z"/>',
 flag:'<path d="M5 21V4m0 1c3-2 5 2 8 0s5 2 7 0v11c-2 2-4-2-7 0s-5-2-8 0"/>',
 download:'<path d="M12 3v13m-4-4 4 4 4-4M4 17v4h16v-4"/>',
 upload:'<path d="M12 21V8m-4 4 4-4 4 4M4 7V3h16v4"/>',
 trash:'<path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',
 bulb:'<path d="M9 18h6m-5 3h4M9 15c-2-2-3-4-3-6a6 6 0 0 1 12 0c0 2-1 4-3 6l-.5 3h-5z"/>',
 layers:'<path d="m12 2 9 5-9 5-9-5 9-5zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v1"/>',
 award:'<circle cx="12" cy="8" r="6"/><path d="m8 13-2 9 6-3 6 3-2-9"/>',
 search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'};
const ico=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.spark}</svg>`;
function notify(msg){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>t.remove(),3800)}
const localDate=(d=Date.now())=>new Date(d).toLocaleDateString('sv-SE');
const dateLabel=(d)=>new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=(s)=>{s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')};
function pct(n,d){return d?Math.round(100*n/d):0}
function stats(){const a=db.attempts;const pts=a.reduce((n,x)=>n+x.score,0),max=a.reduce((n,x)=>n+x.max,0);const today=a.filter(x=>localDate(x.at)===localDate()).length;let streak=0,cur=new Date();if(!a.some(x=>localDate(x.at)===localDate(cur.getTime())))cur.setDate(cur.getDate()-1);while(a.some(x=>localDate(x.at)===localDate(cur.getTime()))){streak++;cur.setDate(cur.getDate()-1)}const uniquePos=new Set(a.map(x=>x.pos)).size;return {attempts:a.length,pts,max,accuracy:pct(pts,max),today,streak,uniquePos,exams:db.sessions.filter(s=>s.mode==='exam').length}}
function topicStats(topic){const a=db.attempts.filter(x=>x.topic===topic),s=a.reduce((n,x)=>n+x.score,0),m=a.reduce((n,x)=>n+x.max,0);return {attempts:a.length,score:s,max:m,pct:pct(s,m)}}
function posStats(pos){const a=db.attempts.filter(x=>x.pos===pos),s=a.reduce((n,x)=>n+x.score,0),m=a.reduce((n,x)=>n+x.max,0);return {count:a.length,pct:pct(s,m)}}
function dueQuestions(){const now=Date.now();return QUESTIONS.filter(q=>db.reviews[q.id]&&db.reviews[q.id].due<=now).sort((a,b)=>db.reviews[a.id].due-db.reviews[b.id].due)}
function mistakes(){const last={};db.attempts.forEach(a=>last[a.questionId]=a);return QUESTIONS.filter(q=>last[q.id]&&last[q.id].score<last[q.id].max)}
function recommendations(){return Object.keys(CATEGORIES).map(k=>({k,...topicStats(k)})).sort((a,b)=>{
   const aa=a.attempts===0?38:a.pct+(a.attempts<3?4:0),bb=b.attempts===0?38:b.pct+(b.attempts<3?4:0);return aa-bb
 });}
function pick(pool,n){const counts={};db.attempts.forEach(a=>{counts[a.questionId]=(counts[a.questionId]||0)+1});return [...pool].sort((a,b)=>{const d=(counts[a.id]||0)-(counts[b.id]||0);return d||Math.random()-.5}).slice(0,n)}
function start(mode,opts={}){
 if(db.active&&!window.confirm('Текущая тренировка ещё не закончена. Начать новую и закрыть незавершённую?'))return;
 let chosen=[];
 if(mode==='exam')chosen=POSITIONS.map(p=>pick(QUESTIONS.filter(q=>q.pos===p.num),1)[0]);
 else if(mode==='review'){const d=dueQuestions();chosen=pick(d.length?d:mistakes(),Math.min(10,(d.length?d:mistakes()).length));}
 else if(mode==='diagnostic'){
   const nums=[1,2,3,4,5,6,8,9,10,11,14,16,17,18,19,20,21,22];
   chosen=pick(nums.map(p=>pick(QUESTIONS.filter(q=>q.pos===p),1)[0]),12);
 }else if(mode==='adaptive'){
   let prioritized=[];for(const rec of recommendations())prioritized.push(...pick(QUESTIONS.filter(q=>q.topic===rec.k),rec.attempts?4:2));
   chosen=pick(prioritized,10);
 }else{
   let pool=QUESTIONS.filter(q=>(!opts.topic||opts.topic==='all'||q.topic===opts.topic)&&(!opts.pos||opts.pos==='all'||q.pos===Number(opts.pos)));
   chosen=pick(pool,Number(opts.count)||10);
 }
 if(!chosen.length){notify('Заданий для повторения пока нет. Пройди тренировку или диагностику.');return}
 db.active={id:'s'+Date.now(),mode,ids:chosen.map(q=>q.id),index:0,answers:{},checked:{},awarded:{},hints:{},flags:{},start:Date.now(),end:mode==='exam'?Date.now()+EXAM_SECONDS:null,phase:'answer',marks:{},times:{}};
 persist();go('session');
}
function calculate(q,ans){const normalized=String(ans??'').trim().replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.');const right=String(q.answer).trim().replace(/−/g,'-').replace(/,/g,'.');const max=POS[q.pos].points;
 if(!normalized)return 0;
 if(q.kind==='number'){const v=Number(normalized),r=Number(right);return Number.isFinite(v)&&Math.abs(v-r)<=Math.max(0.005,Math.abs(r)*0.0001)?max:0}
 if(q.kind==='multi'){const a=[...new Set(normalized.split(''))].sort().join(''),b=right.split('').sort().join('');if(a===b)return max;if(max===2&&a.length===2&&a.split('').filter(c=>b.includes(c)).length===1)return 1;return 0}
 if(q.kind==='sequence'){if(normalized===right)return max;if(max===2&&normalized.length===right.length){let diff=0;for(let i=0;i<right.length;i++)if(normalized[i]!==right[i])diff++;if(diff===1)return 1}return 0}
 return normalized===right?max:0;
}
function record(q,score,s,at=Date.now()){if(s.awarded[q.id]!==undefined)return;s.awarded[q.id]=score;db.attempts.push({questionId:q.id,pos:q.pos,topic:q.topic,score,max:POS[q.pos].points,mode:s.mode,hint:!!s.hints[q.id],at});const rv=db.reviews[q.id]||{streak:0};const perfect=score===POS[q.pos].points&&!s.hints[q.id];const streak=perfect?rv.streak+1:0;const interval=perfect?[1,3,7,14,30][Math.min(streak-1,4)]:0;db.reviews[q.id]={streak,due:at+(perfect?interval*MS_DAY:10*60000),last:at};persist()}
function finalSession(){let s=db.active;if(!s)return;const scores=s.ids.map(id=>({id,score:s.awarded[id]??0,max:POS[QBYID[id].pos].points}));const earned=scores.reduce((n,x)=>n+x.score,0),total=scores.reduce((n,x)=>n+x.max,0);const result={id:s.id,mode:s.mode,date:Date.now(),duration:Math.round((Date.now()-s.start)/1000),earned,total,scores,usedHints:Object.values(s.hints).filter(Boolean).length};db.sessions.unshift(result);db.lastResult=result;db.active=null;persist();go('result')}
function examToGrading(){if(!db.active)return;db.active.phase='grade';persist();render()}
function finishExam(){let s=db.active;if(!s)return;for(const id of s.ids){const q=QBYID[id];const score=q.kind==='written'?Number(s.marks[id]??0):calculate(q,s.answers[id]);record(q,score,s)}finalSession()}
function nextPractice(skip=false){const s=db.active;if(!s)return;const q=QBYID[s.ids[s.index]];if(skip&&s.awarded[q.id]===undefined)record(q,0,s);if(!skip&&s.awarded[q.id]===undefined){notify('Сначала проверь ответ или выбери «Пропустить».');return}if(s.index===s.ids.length-1){finalSession();return}s.index++;persist();render()}
function gradePractice(score){const s=db.active;if(!s)return;const q=QBYID[s.ids[s.index]];if(q.kind!=='written'||!s.checked[q.id])return;record(q,score,s);render()}
function checkPractice(){const s=db.active;if(!s)return;const q=QBYID[s.ids[s.index]];if(s.awarded[q.id]!==undefined)return;if(q.kind==='written'){s.checked[q.id]=true;persist();render();return}const ans=s.answers[q.id];if(ans===undefined||String(ans).trim()===''){notify('Сначала введи или выбери ответ.');return}record(q,calculate(q,ans),s);s.checked[q.id]=true;persist();render()}
function go(page){ui.page=page;const loc='#'+page;if(location.hash!==loc)history.replaceState(null,'',loc);render();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',()=>{ui.page=location.hash.substring(1)||'dashboard';render()});
function navbar(){const entries=[['dashboard','Главная','home'],['training','Тренажёр','target'],['catalog','Типы заданий','layers'],['learn','Теория','book'],['analytics','Аналитика','chart'],['review','Ошибки и повтор','repeat'],['settings','Настройки','settings']];return `<aside class="sidebar"><div class="brand"><div class="brandmark">φ</div><div><div class="brandname">Физика<em>.ОГЭ</em></div><span class="brandtag">STUDY STUDIO · 2027</span></div></div><div class="nav-title">ОБУЧЕНИЕ</div><nav class="nav-group">${entries.slice(0,4).map(([k,t,i])=>`<button class="navlink ${ui.page===k?'active':''}" data-action="go" data-page="${k}">${ico(i)}${t}</button>`).join('')}</nav><div class="nav-title" style="margin-top:28px">МОЙ ПРОГРЕСС</div><nav class="nav-group">${entries.slice(4).map(([k,t,i])=>`<button class="navlink ${ui.page===k?'active':''}" data-action="go" data-page="${k}">${ico(i)}${t}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-note"><div class="sidebar-note-title">✦ Твоя суперсила — регулярность</div><p>20–30 минут осознанной практики полезнее, чем марафон раз в неделю.</p></div><div class="side-mini">Сохраняется только в этом браузере<br>Независимый учебный проект</div></div></aside>`}
function mobileNav(){const xs=[['dashboard','home','Главная'],['training','target','Задачи'],['catalog','layers','Каталог'],['analytics','chart','Прогресс'],['review','repeat','Ошибки']];return `<nav class="mobile-nav">${xs.map(([k,i,t])=>`<a href="#${k}" class="${ui.page===k?'active':''}" data-action="go" data-page="${k}">${ico(i)}<span>${t}</span></a>`).join('')}</nav>`}
function header(){const title={dashboard:'Обзор',training:'Режимы подготовки',catalog:'Каталог заданий',learn:'Теория и формулы',analytics:'Личная аналитика',review:'Повторение и ошибки',session:'Сессия тренировки',result:'Результаты сессии',settings:'Настройки'}[ui.page]||'Обзор';return `<div class="topbar"><div class="mobile-topbrand"><span class="brandmark">φ</span>Физика.ОГЭ</div><div class="crumb" style="flex:1"><span style="color:#697d96">Подготовка / </span><span>${title}</span></div><div class="topactions"><span class="topdate">${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span><button class="icon-btn" data-action="go" data-page="settings" aria-label="Настройки">${ico('settings')}</button><button class="user-chip" data-action="go" data-page="settings"><span class="avatar">${safe(db.name.trim()[0]||'У').toUpperCase()}</span><span class="username">${safe(db.name)}</span></button></div></div>`}
function sourceFooter(){return `<div class="sources">Формат экзамена: проект ФИПИ ОГЭ-2027. 22 задания · 180 минут · 39 первичных баллов. Упражнения на этом сайте авторские, не идентичны заданиям официального банка. <a href="https://fipi.ru/oge/demoversii-specifikacii-kodifikatory" target="_blank" rel="noopener noreferrer">ФИПИ</a> · <a href="https://phys-oge.sdamgia.ru/test?id=5205310" target="_blank" rel="noopener noreferrer">Исходный вариант №5205310</a>.</div>`}
function hero(){const s=stats();return `<div class="hero"><div class="hero-content"><div class="hero-label">ТВОЯ ПЕРСОНАЛЬНАЯ ФИЗИКА</div><h2>${s.attempts?'Каждая задача делает тебя <strong>сильнее.</strong>':'Прокачай физику. <strong>Забери свои баллы.</strong>'}</h2><p>${s.attempts?'Твои результаты уже помогают выбирать полезные темы. Продолжай в своём темпе — мы покажем, над чем работать дальше.':'22 типа заданий, оригинальные упражнения и умный план повторений. Никакой случайной зубрёжки — только понятный прогресс.'}</p><div class="hero-actions"><button class="btn btn-primary" data-action="${db.active?'go':'start'}" data-page="session" data-mode="adaptive">${ico('arrow')}${db.active?'Продолжить тренировку':'Начать тренировку'}</button><button class="btn btn-ghost" data-action="start" data-mode="diagnostic">${ico('target')}Диагностика</button></div></div><div class="atom"><div class="orbit"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="atom-center">φ</div></div></div>`}
function weekly(){let a=db.attempts,days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);const k=localDate(d.getTime()),count=a.filter(x=>localDate(x.at)===k).length;days.push({label:d.toLocaleDateString('ru-RU',{weekday:'short'}),count})}const max=Math.max(5,...days.map(x=>x.count));return `<div class="week-bars">${days.map(d=>`<div class="week-col" title="${d.count} заданий"><div class="bar ${d.count===0?'empty':''}" style="height:${Math.max(5,d.count/max*88)}px"></div><span>${d.label}</span></div>`).join('')}</div>`}
function overview(){const s=stats(),d=dueQuestions(),r=recommendations();return `<div class="page-head"><div><div class="header-kicker">ПАНЕЛЬ УЧЕНИКА</div><h1>Привет, ${safe(db.name)} 👋</h1><p>Держи фокус на регулярной практике и понимании решений.</p></div><span class="pill green">${ico('spark')} ОГЭ · Физика · 2027</span></div>${hero()}
<div class="stats-grid"><div class="stat-card"><div class="stat-icon">✓</div><div class="stat-num">${s.attempts}</div><div class="stat-label">Решено заданий</div></div><div class="stat-card"><div class="stat-icon">◷</div><div class="stat-num">${s.accuracy}<span style="font-size:15px">%</span></div><div class="stat-label">Набрано баллов в тренировках</div></div><div class="stat-card"><div class="stat-icon">♨</div><div class="stat-num">${s.streak}</div><div class="stat-label">Дней подряд</div></div><div class="stat-card"><div class="stat-icon">▦</div><div class="stat-num">${s.uniquePos}<span style="font-size:15px;color:#8fa8bd">/22</span></div><div class="stat-label">Опробовано типов</div></div></div>
${db.active?`<div class="action-strip"><div class="accent">◷</div><div><strong>Есть незавершённая сессия</strong><p>Прогресс сохранён. Можно продолжить с того же места.</p></div><button class="btn btn-primary" data-action="go" data-page="session">Продолжить ${ico('arrow')}</button></div>`:''}
<div class="two-cols"><div class="card"><div class="card-title"><span>Ежедневная цель</span><span class="pill green">${s.today>=db.goal?'Цель выполнена':'Сегодня'}</span></div><div class="daily-card"><div class="ring" style="--percent:${Math.min(100,pct(s.today,db.goal))}%"><div class="ring-inner"><strong>${s.today}<span style="font-size:13px;color:#91a9bf">/${db.goal}</span></strong><small>заданий</small></div></div><div class="daily-copy"><h3>${s.today>=db.goal?'Отличная работа!':'Небольшие шаги — большой результат'}</h3><p class="subtle">${s.today>=db.goal?'Сегодня план выполнен. Можно закрепить сложную тему или отдохнуть.':'Закрепи хотя бы несколько задач сегодня — это помогает удержать материал.'}</p><div class="progress-line"><div class="progress-fill" style="width:${Math.min(100,pct(s.today,db.goal))}%"></div></div><button class="btn btn-sm btn-outline" data-action="start" data-mode="adaptive">Умная подборка ${ico('arrow')}</button></div></div></div><div class="card"><div class="card-title">Активность за неделю <span class="subtle">решено за день</span></div>${weekly()}<div class="footer-aux"><span>Всего пробников: ${s.exams}</span><span>•</span><span>Повторить: ${d.length}</span></div></div></div>
<div class="two-cols"><div class="card"><div class="card-title">Твои разделы <button class="btn btn-sm btn-ghost" data-action="go" data-page="analytics">Вся аналитика ${ico('arrow')}</button></div><div class="topic-list">${Object.entries(CATEGORIES).map(([k,v])=>{let t=topicStats(k);return `<div class="topic-row"><div class="t-head"><strong>${safe(v.icon)} ${safe(v.name)}</strong><span>${t.attempts?`${t.pct}% · ${t.attempts} попыток`:'Нет данных'}</span></div><div class="progress-line"><div class="progress-fill" style="width:${t.pct}%"></div></div></div>`}).join('')}</div></div><div class="card"><div class="card-title">Персональный фокус ${ico('spark')}</div><p class="subtle" style="margin-top:-5px">${s.attempts?'Приоритет вычисляется по ошибкам и количеству практики.':'Пока данных нет — сначала попробуй разные разделы.'}</p>${r.slice(0,3).map((v,i)=>`<div class="insight"><strong>${i+1}. ${CATEGORIES[v.k].name}</strong><small>${v.attempts?`Освоение по попыткам: ${v.pct}% · ${v.attempts} ответов`:'Ещё не проверяли знания в этом разделе'}</small><div style="margin-top:10px"><button class="btn btn-sm btn-outline" data-action="start" data-mode="custom" data-topic="${v.k}" data-count="6">Тренировать тему</button></div></div>`).join('')}</div></div>
<div class="card"><div class="card-title">Карта экзамена <span class="pill">22 позиции</span></div><p class="subtle" style="margin:0 0 15px">Нажми на номер, чтобы отработать конкретный тип. Цвет отражает результат предыдущих попыток.</p>${posGrid()}<div class="footer-aux"><span style="color:#8af0d3">● уверенно</span><span style="color:#ffcb93">● нужно закрепить</span><span style="color:#f49bae">● есть ошибки</span><span>● ещё не решали</span></div></div>${sourceFooter()}`}
function posGrid(){return `<div class="position-grid">${POSITIONS.map(p=>{const t=posStats(p.num),cls=t.count?(t.pct>=80?'good':t.pct>=50?'medium':'bad'):'';return `<button title="№${p.num}: ${safe(p.name)} · ${p.points} балл(а)" class="position-tile ${cls}" data-action="start" data-mode="custom" data-pos="${p.num}" data-count="3">${p.num}<small>${p.points}</small></button>`}).join('')}</div>`}
function training(){const d=dueQuestions();return `<div class="page-head"><div><div class="header-kicker">ТРЕНИРУЙСЯ С УМОМ</div><h1>Выбери свой режим</h1><p>Каждый формат решает свою задачу: найти пробелы, закрепить знания или проверить готовность к экзамену.</p></div></div><div class="mode-grid"><div class="card mode-card recommended"><span class="pill green" style="margin-bottom:12px">РЕКОМЕНДУЕМ</span><div class="mode-emoji">✦</div><h3>Умная тренировка</h3><p>10 упражнений с упором на слабые и недостаточно изученные темы. Подсказки и подробные решения.</p><button class="btn btn-primary" data-action="start" data-mode="adaptive">Начать ${ico('arrow')}</button></div><div class="card mode-card"><div class="mode-emoji">◎</div><h3>Диагностика</h3><p>12 заданий из разных экзаменационных позиций. Быстрая проверка стартового уровня.</p><button class="btn btn-ghost" data-action="start" data-mode="diagnostic">Пройти диагностику ${ico('arrow')}</button></div><div class="card mode-card"><div class="mode-emoji">◷</div><h3>Пробный ОГЭ</h3><p>22 позиции · 180 минут · 39 баллов. Без подсказок, с самопроверкой развёрнутых решений.</p><button class="btn btn-ghost" data-action="start" data-mode="exam">Начать экзамен ${ico('arrow')}</button></div></div>
<div class="two-cols"><div class="card"><div class="card-title">Своя тренировка <span class="pill">Гибкий выбор</span></div><p class="subtle">Подбери раздел, тип задания и объём сессии. Ответы проверяются по ходу.</p><div class="filters"><select class="select" data-filter="topic" aria-label="Раздел"><option value="all">Все разделы</option>${Object.entries(CATEGORIES).map(([k,v])=>`<option value="${k}" ${ui.topic===k?'selected':''}>${safe(v.name)}</option>`).join('')}</select><select class="select" data-filter="position" aria-label="Номер задания"><option value="all">Все номера</option>${POSITIONS.map(p=>`<option value="${p.num}" ${ui.position==p.num?'selected':''}>№ ${p.num} — ${p.name}</option>`).join('')}</select><select class="select" data-filter="count" aria-label="Количество"><option value="5" ${ui.count==='5'?'selected':''}>5 задач</option><option value="10" ${ui.count==='10'?'selected':''}>10 задач</option><option value="15" ${ui.count==='15'?'selected':''}>15 задач</option><option value="22" ${ui.count==='22'?'selected':''}>22 задачи</option></select></div><button class="btn btn-primary" data-action="custom">${ico('target')}Собрать тренировку</button></div><div class="card"><div class="card-title">Повторение ошибок ${ico('repeat')}</div><p class="subtle">Задания попадают в повторение после ошибки примерно через 10 минут; после удачного решения интервал растёт.</p><div style="font-size:30px;font-weight:850;margin:18px 0">${d.length}<span style="font-size:12px;color:#9aaabe;font-weight:600;margin-left:8px">ожидают повторения</span></div><button class="btn btn-ghost" data-action="start" data-mode="review" ${(!d.length&&!mistakes().length)?'disabled':''}>Повторить ${ico('arrow')}</button></div></div>${sourceFooter()}`}
function catalog(){const filtered=POSITIONS.filter(p=>p.name.toLowerCase().includes(ui.search.toLowerCase())||String(p.num)===ui.search.trim());return `<div class="page-head"><div><div class="header-kicker">КАРТА ЭКЗАМЕНА</div><h1>Все 22 типа заданий</h1><p>К каждому типу подготовлено по три самостоятельных упражнения: всего ${QUESTIONS.length} задач с решениями.</p></div><a class="btn btn-outline" href="https://phys-oge.sdamgia.ru/test?id=5205310" target="_blank" rel="noopener noreferrer">Исходный вариант ↗</a></div><div class="filters"><input class="input" placeholder="Поиск по номеру или названию" aria-label="Поиск типов заданий" data-filter="search" value="${attr(ui.search)}" style="flex:1;min-width:220px"/><span class="pill">${filtered.length} типов</span></div><div id="catalog-items" class="catalog-list">${catalogItems(filtered)}</div>${sourceFooter()}`}
function catalogItems(filtered){return filtered.map(p=>{const t=posStats(p.num);return `<div class="catalog-item"><div class="catalog-num">${p.num}</div><div class="catalog-content"><h3>${safe(p.name)}</h3><p>${p.points} ${p.points===1?'балл':p.points===2?'балла':'балла'} · ${p.level==='Б'?'Базовый':p.level==='П'?'Повышенный':'Высокий'} · 3 авторских примера · ${t.count?`результат ${t.pct}%`:'не проходили'}</p><button class="btn btn-sm btn-outline" data-action="start" data-mode="custom" data-pos="${p.num}" data-count="3">Решать тип ${ico('arrow')}</button></div></div>`}).join('')||'<div class="empty">Ничего не найдено.</div>'}
function learning(){return `<div class="page-head"><div><div class="header-kicker">ПОНЯТНО И ПО ДЕЛУ</div><h1>Теория + практика</h1><p>Краткие опорные конспекты: формулы, типичные ошибки и подход к решению.</p></div></div><div class="learn-grid">${LESSONS.map(l=>`<div class="card learning-card"><div class="learning-head"><span class="topic-symbol" style="color:${CATEGORIES[l.topic].color}">${CATEGORIES[l.topic].icon}</span><div><h3>${l.title}</h3><p>${l.subtitle}</p></div></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:21px"><span class="pill">~ ${l.minutes} мин · ${l.formulas.length} формул</span><button class="btn btn-sm btn-outline" data-action="lesson" data-topic="${l.topic}">Изучить ${ico('arrow')}</button></div></div>`).join('')}</div><div class="action-strip" style="margin-top:18px"><div class="accent">✎</div><div><strong>Как действительно запоминать</strong><p>Сначала попробуй решить сам, потом посмотри объяснение, назови ошибку и повтори задачу с интервалом.</p></div></div>${sourceFooter()}`}
function lesson(){const l=LESSONS.find(x=>x.topic===ui.learnTopic)||LESSONS[0];return `<div class="page-head"><div><div class="header-kicker">КОНСПЕКТ · ${safe(CATEGORIES[l.topic].name)}</div><h1>${l.title}</h1><p>${l.subtitle}</p></div><button class="btn btn-ghost" data-action="go" data-page="learn">${ico('back')}Все темы</button></div><div class="two-cols"><div class="card"><div class="card-title">Главные формулы</div><div class="formula-list">${l.formulas.map(([name,f])=>`<div class="formula-row"><span>${safe(name)}</span><strong>${safe(f)}</strong></div>`).join('')}</div></div><div class="card"><div class="card-title">Избегай этих ошибок</div><ul class="bullets">${l.mistakes.map(e=>`<li>${safe(e)}</li>`).join('')}</ul><div class="callout">${ico('bulb')} <strong>Приём:</strong> ${safe(l.tip)}</div><div style="margin-top:20px"><button class="btn btn-primary" data-action="start" data-mode="custom" data-topic="${l.topic}" data-count="10">Закрепить задачами ${ico('arrow')}</button></div></div></div>${sourceFooter()}`}
function analytics(){const s=stats();return `<div class="page-head"><div><div class="header-kicker">АНАЛИТИКА ОБУЧЕНИЯ</div><h1>Прогресс под микроскопом</h1><p>Статистика строится на твоих ответах, а не на приблизительных оценках. Для достоверных выводов полезно решить несколько заданий каждого типа.</p></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon">⌁</div><div class="stat-num">${s.accuracy}%</div><div class="stat-label">Полученные / возможные баллы</div></div><div class="stat-card"><div class="stat-icon">✓</div><div class="stat-num">${s.attempts}</div><div class="stat-label">Всего ответов</div></div><div class="stat-card"><div class="stat-icon">▦</div><div class="stat-num">${s.uniquePos}/22</div><div class="stat-label">Покрытие типов</div></div><div class="stat-card"><div class="stat-icon">◎</div><div class="stat-num">${s.exams}</div><div class="stat-label">Пробных экзаменов</div></div></div>${s.attempts?`<div class="two-cols"><div class="card"><div class="card-title">Освоение по темам <span class="subtle">Доля набранных баллов</span></div><div class="topic-accuracy">${Object.entries(CATEGORIES).map(([k,v])=>{const t=topicStats(k);return `<div class="analysis-row"><span>${v.icon} ${v.name}</span><div class="progress-line"><div class="progress-fill" style="width:${t.pct}%"></div></div><strong style="text-align:right">${t.attempts?t.pct+'%':'—'}</strong></div>`}).join('')}</div><p class="subtle" style="margin-top:22px">Малое число ответов не позволяет надёжно судить об освоении раздела.</p></div><div class="card"><div class="card-title">Последние 7 дней <span class="subtle">Задач в день</span></div>${weekly()}<div class="mini-rule"></div><div class="card-title">Что стоит повторить</div>${recommendations().slice(0,3).map(x=>`<div class="insight"><strong>${CATEGORIES[x.k].name}</strong><small>${x.attempts?`Результат ${x.pct}% по ${x.attempts} ответам`:'Пока нет решённых заданий'}</small></div>`).join('')}</div></div><div class="card" style="margin-bottom:19px"><div class="card-title">Освоение всех 22 позиций</div>${posGrid()}</div><div class="card"><div class="card-title">История тренировок</div>${historyTable()}</div>`:`<div class="empty"><div class="empty-icon">◉</div><h3>Начни с диагностики</h3><p>После первых задач здесь появятся реальные показатели, история сессий и список тем, требующих внимания.</p><button class="btn btn-primary" data-action="start" data-mode="diagnostic">Проверить уровень ${ico('arrow')}</button></div>`}${sourceFooter()}`}
function historyTable(){if(!db.sessions.length)return `<div class="empty"><p>Завершённых тренировок ещё нет.</p></div>`;return `<div style="overflow-x:auto"><table class="history-table"><thead><tr><th>Дата</th><th>Режим</th><th>Результат</th><th>Время</th><th></th></tr></thead><tbody>${db.sessions.slice(0,25).map(x=>`<tr><td>${dateLabel(x.date)}</td><td>${modeName(x.mode)}</td><td><strong>${x.earned}/${x.total}</strong> · ${pct(x.earned,x.total)}%</td><td>${Math.max(1,Math.ceil(x.duration/60))} мин</td><td><button class="btn btn-sm btn-ghost" data-action="history-result" data-id="${x.id}">Подробнее</button></td></tr>`).join('')}</tbody></table></div>`}
function review(){const due=dueQuestions(),wrong=mistakes();return `<div class="page-head"><div><div class="header-kicker">РАБОТА НАД ОШИБКАМИ</div><h1>Повторить — значит запомнить</h1><p>Интервальное повторение: после верного ответа без подсказки следующие интервалы 1, 3, 7, 14 и 30 дней. После ошибки — короткий повтор.</p></div><button class="btn btn-primary" data-action="start" data-mode="review" ${(!due.length&&!wrong.length)?'disabled':''}>${ico('repeat')} Начать повторение</button></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon">◷</div><div class="stat-num">${due.length}</div><div class="stat-label">Доступно к повторению</div></div><div class="stat-card"><div class="stat-icon">✕</div><div class="stat-num">${wrong.length}</div><div class="stat-label">С ошибками в последней попытке</div></div><div class="stat-card"><div class="stat-icon">✓</div><div class="stat-num">${Object.values(db.reviews).filter(x=>x.streak>=2).length}</div><div class="stat-label">Закреплено повторением</div></div><div class="stat-card"><div class="stat-icon">◎</div><div class="stat-num">${Object.keys(db.reviews).length}</div><div class="stat-label">Знакомых задач</div></div></div><div class="card"><div class="card-title">Твои сложные задания <span class="pill">Последний результат</span></div>${wrong.length?wrong.map(q=>{const a=[...db.attempts].reverse().find(x=>x.questionId===q.id);return `<div class="review-row"><div class="review-top"><strong>№${q.pos} · ${safe(POS[q.pos].name)}</strong><span class="pill red">${a.score}/${a.max} балл.</span></div><p>${safe(q.prompt).slice(0,240)}${q.prompt.length>240?'…':''}</p><details><summary>Разобрать решение</summary><p>${safe(q.solution)}</p></details><div style="margin-top:12px"><button class="btn btn-sm btn-outline" data-action="start" data-mode="custom" data-pos="${q.pos}" data-count="3">Потренировать №${q.pos}</button></div></div>`}).join(''):`<div class="empty"><div class="empty-icon">✓</div><h3>Нерешённых ошибок пока нет</h3><p>Ошибки из тренировок появятся здесь. Даже правильные задачи позже попадут в плановое повторение.</p><button class="btn btn-ghost" data-action="go" data-page="training">Перейти к тренировкам</button></div>`}</div>${sourceFooter()}`}
function settings(){return `<div class="page-head"><div><div class="header-kicker">ПОД ТВОЙ РИТМ</div><h1>Настройки и данные</h1><p>Никаких регистраций и внешних серверов. Прогресс хранится локально в твоём браузере.</p></div></div><div class="two-cols"><div class="card"><div class="card-title">Профиль ученика</div><div class="settings-block"><label for="student-name">Имя</label><input id="student-name" class="input" maxlength="32" value="${attr(db.name)}"/></div><div class="settings-block" style="margin-top:14px"><label for="student-goal">Дневная цель</label><select id="student-goal" class="select">${[3,5,10,15,20].map(n=>`<option value="${n}" ${db.goal===n?'selected':''}>${n} задач/день</option>`).join('')}</select></div><div style="margin-top:21px"><button class="btn btn-primary" data-action="save-settings">Сохранить изменения</button></div></div><div class="card"><div class="card-title">Резервная копия прогресса</div><p class="subtle">Экспорт пригодится при переустановке браузера или переносе на другое устройство. Он содержит историю ответов и результаты экзаменов.</p><div class="settings-block"><button class="btn btn-ghost" data-action="export">${ico('download')} Скачать JSON</button><label for="import-file" class="btn btn-outline" style="cursor:pointer">${ico('upload')} Импортировать</label><input type="file" id="import-file" accept=".json,application/json" hidden /></div></div></div><div class="card" style="margin-bottom:18px"><div class="card-title">Важно о проверке</div><p class="subtle">Задания с числовым ответом и выбором вариантов проверяются автоматически. Развёрнутые задачи №17–22 оцениваются учеником самостоятельно по приведённым критериям; это учебная самооценка, а не экспертная проверка ФИПИ. В №17 на настоящем экзамене необходимо работать с оборудованием.</p><div class="reference">Первоначальная ссылка: <a href="https://phys-oge.sdamgia.ru/test?id=5205310" target="_blank" rel="noopener noreferrer">Решу ОГЭ, вариант 5205310</a>. Официальные документы: <a href="https://fipi.ru/oge/demoversii-specifikacii-kodifikatory" target="_blank" rel="noopener noreferrer">ФИПИ</a>. Это независимый тренажёр с оригинальными формулировками, не связанный с указаными организациями.</div></div><div class="card" style="border-color:#593b4b"><div class="card-title">Удалить прогресс</div><p class="danger-note">Удалит ответы, историю, повторения и все настройки в текущем браузере. Отменить действие нельзя.</p><button class="btn btn-danger" data-action="reset">${ico('trash')} Сбросить данные</button></div>`}
const modeName=m=>({exam:'Пробный ОГЭ',diagnostic:'Диагностика',adaptive:'Умная тренировка',custom:'Тренировка по выбору',review:'Повторение'})[m]||'Тренировка';
function visualMarkup(kind){if(!kind)return '';
 const begin='<div class="diagram" role="img" aria-label="Учебная схема или график">',end='</div>';
 const svg=(body)=>`${begin}<svg viewBox="0 0 480 195" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#8199b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${body}</g></svg>${end}`;
 if(kind==='series')return svg('<path d="M30 110H110l10-18 15 36 15-36 15 36 15-18h90l10-18 15 36 15-36 15 36 15-18h85"/><text x="125" y="77" stroke="none" fill="#92ebdd" font-size="14">4 Ом</text><text x="300" y="77" stroke="none" fill="#92ebdd" font-size="14">6 Ом</text>');
 if(kind==='parallel')return svg('<path d="M50 100h70v-45h55l10-14 13 28 13-28 13 14h100v45h70M120 100v45h55l10-14 13 28 13-28 13 14h100v-45"/><text x="187" y="27" fill="#88ebd0" stroke="none" font-size="12">6 Ом</text><text x="190" y="183" stroke="none" fill="#88ebd0" font-size="12">3 Ом</text>');
 if(kind==='graph-motion'||kind==='graph-heat'){
 const heat=kind==='graph-heat',pts=heat?'65,130 150,92 235,55 405,55':'65,150 175,112 285,74 395,36';
 return svg(`<path d="M60 13v146h375"/><path d="m55 21 5-8 5 8M426 154l9 5-9 5"/><path d="M60 130H415M60 90H415M60 50H415" stroke-dasharray="4 7" opacity=".3"/><polyline points="${pts}" stroke="#6ee4c6" stroke-width="3.5"/><text x="15" y="22" fill="#afc6da" stroke="none" font-size="14">${heat?'T, °C':'x, м'}</text><text x="420" y="180" fill="#afc6da" stroke="none" font-size="14">${heat?'t, мин':'t, с'}</text><text x="55" y="177" fill="#8199b5" stroke="none" font-size="12">0</text>${heat?'<text x="225" y="178" fill="#8199b5" stroke="none" font-size="12">4</text><text x="401" y="178" fill="#8199b5" stroke="none" font-size="12">8</text><text x="13" y="59" fill="#8199b5" stroke="none" font-size="12">60</text>':'<text x="169" y="178" fill="#8199b5" stroke="none" font-size="12">1</text><text x="280" y="178" fill="#8199b5" stroke="none" font-size="12">2</text><text x="390" y="178" fill="#8199b5" stroke="none" font-size="12">3</text><text x="30" y="39" fill="#8199b5" stroke="none" font-size="12">12</text>'}`);
 }
 const tables={
 'table-ohm':[['U, В','2','4','6','8'],['I, А','0,5','1','1,5','2']],
 'table-spring':[['F, Н','0','1','2','3'],['l, см','10','12','14','16']],
 'table-pendulum':[['Длина, м','0,25','1'],['Период, с','1','2']],
 'table-density':[['Образец','1','2'],['Масса, г','30','60'],['Объём, см³','10','20']]
 };
 if(tables[kind]){const rows=tables[kind];return `<div class="diagram"><table class="history-table" style="width:100%;text-align:center">${rows.map(r=>`<tr>${r.map(x=>`<td style="text-align:center">${x}</td>`).join('')}</tr>`).join('')}</table></div>`}
 if(kind==='ruler')return svg(`<path d="M33 90h410v65H33z" stroke="#a0c8d7"/><path d="${Array.from({length:26},(_,i)=>`M${35+i*16} 90v${i%5===0?27:11}`).join(' ')}"/><text x="31" y="132" fill="#9bdecb" stroke="none">0</text><text x="111" y="132" fill="#9bdecb" stroke="none">1</text><text x="191" y="132" fill="#9bdecb" stroke="none">2</text><text x="271" y="132" fill="#9bdecb" stroke="none">3</text><text x="351" y="132" fill="#9bdecb" stroke="none">4</text><text x="430" y="132" fill="#9bdecb" stroke="none">5</text>`);
 if(kind==='ammeter')return svg(`<path d="M100 150A140 140 0 0 1 380 150"/><path d="${Array.from({length:11},(_,i)=>{let a=Math.PI-i*Math.PI/10,x1=240+140*Math.cos(a),y1=150-140*Math.sin(a),x2=240+122*Math.cos(a),y2=150-122*Math.sin(a);return `M${x1.toFixed(0)} ${y1.toFixed(0)}L${x2.toFixed(0)} ${y2.toFixed(0)}`}).join(' ')}"/><text x="86" y="171" fill="#9bdecb" stroke="none">0</text><text x="374" y="171" fill="#9bdecb" stroke="none">2 А</text><text x="221" y="140" fill="#9bdecb" stroke="none" font-size="26">A</text>`);
 if(kind==='thermometer')return svg('<rect x="220" y="20" width="40" height="140" rx="20"/><circle cx="240" cy="158" r="20" stroke="#efb1ae"/><path d="M240 147V54" stroke="#efb1ae" stroke-width="7"/><text x="275" y="28" stroke="none" fill="#aabdd0">+50 °C</text><text x="275" y="160" stroke="none" fill="#aabdd0">−10 °C</text>');
 return '';
}
function answerUi(q,s,locked){const val=String(s.answers[q.id]??'');if(q.kind==='choice'||q.kind==='multi')return `<div class="q-options">${q.options.map((op,i)=>{const key=String(i+1),selected=q.kind==='multi'?val.includes(key):val===key;return `<button class="q-option ${selected?'selected':''}" data-action="pick-answer" data-value="${key}" ${locked?'disabled':''}><strong>${key}</strong><span>${safe(op)}</span>${selected?`<span style="margin-left:auto;color:#8bebd2">${ico('check')}</span>`:''}</button>`}).join('')}</div>${q.kind==='multi'?'<div class="answer-hint">Выбери ровно два ответа.</div>':''}`;
 if(q.kind==='written')return `<div class="q-input-wrap"><label for="written-answer" style="display:block;margin-bottom:10px;color:#cbd8e8;font-weight:700">Твоё подробное решение</label><textarea id="written-answer" class="textarea" data-answer="true" placeholder="Запиши формулы, вычисления, единицы и вывод. Можно сначала решить на бумаге…" ${locked?'disabled':''}>${safe(val)}</textarea><span class="answer-hint">Самопроверка по критериям. Для №17 на реальном экзамене нужны физические приборы.</span></div>`;
 return `<div class="q-input-wrap"><label for="numeric-answer" style="display:block;margin-bottom:10px;color:#cbd8e8;font-weight:700">Твой ответ ${q.unit?'('+safe(q.unit)+')':''}</label><input id="numeric-answer" class="q-input" data-answer="true" type="text" inputmode="${q.kind==='number'?'decimal':'numeric'}" autocomplete="off" spellcheck="false" placeholder="${q.kind==='sequence'?'Например: 123':'Введи число'}" value="${attr(val)}" ${locked?'disabled':''}/><span class="answer-hint">${q.kind==='number'?'Вводи только число, без единиц измерения. Можно использовать запятую.':'Укажи последовательность цифр без пробелов.'}</span></div>`;
}
function session(){const s=db.active;if(!s)return `<div class="empty"><h3>Активной сессии нет</h3><button class="btn btn-primary" data-action="go" data-page="training">Выбрать режим</button></div>`;
 if(s.phase==='grade')return grading();
 const q=QBYID[s.ids[s.index]],p=POS[q.pos],isExam=s.mode==='exam';
 const checked=!!s.checked[q.id],score=s.awarded[q.id],done=score!==undefined;
 const locked=!isExam&&checked;
 const elapsed=Math.floor((Date.now()-s.start)/1000);
 const remaining=Math.floor((s.end-Date.now())/1000);
 const time=isExam?fmtTime(remaining):fmtTime(elapsed);
 const label=isExam?'Осталось':'Прошло';
 const helper= !isExam&&(s.hints[q.id]||checked)?`<div class="help-note"><strong>Подсказка:</strong> ${safe(q.hint)}</div>`:'';
 let feedback='';
 if(!isExam&&checked){
   if(q.kind==='written')feedback=`<div class="feedback"><h3>Сверь решение с образцом</h3><p>${safe(q.solution)}</p><div class="mini-rule"></div><strong>Критерии самооценки:</strong><ol class="bullets">${q.criteria.map(x=>`<li>${safe(x)}</li>`).join('')}</ol>${done?`<div class="pill green">Оценено: ${score}/${p.points} балл(а)</div>`:`<div style="font-size:12px;margin:12px 0">Оцени решение по критериям. Баллы не выставляются автоматически.</div><div class="grading-control">${Array.from({length:p.points+1},(_,i)=>`<button class="grade-button" data-action="grade-practice" data-score="${i}">${i} балл${i===1?'':'а'}</button>`).join('')}</div>`}</div>`;
   else feedback=`<div class="feedback ${score===p.points?'':'wrong'}"><h3>${score===p.points?'✓ Верно! Отличная работа':score>0?`◐ Частично верно: ${score}/${p.points}`:'× Пока неверно — разберём почему'}</h3><p>Правильный ответ: <strong>${safe(q.answer)}</strong>.</p><p class="solution"><strong>Разбор:</strong> ${safe(q.solution)}</p></div>`;
 }
 const progress=isExam?Object.values(s.answers).filter(a=>String(a).trim()).length:s.ids.filter(id=>s.awarded[id]!==undefined).length;
 return `<div class="page-head"><div><div class="header-kicker">${isExam?'ПРОБНЫЙ ЭКЗАМЕН':'ТРЕНИРОВОЧНАЯ СЕССИЯ'}</div><h1>${modeName(s.mode)}</h1><p>${isExam?'Работай самостоятельно. Ответы и оценивание будут после завершения.':'Сначала попытка, затем подсказка и разбор. Ошибка — часть обучения.'}</p></div><button class="btn btn-ghost btn-sm" data-action="${isExam?'exam-finish':'end-training'}">Завершить ${ico('arrow')}</button></div>
<div class="question-layout"><div class="card question-card"><div class="session-top"><div class="session-badges"><span class="pill">Задание ${s.index+1} из ${s.ids.length}</span><span class="pill ${p.level==='В'?'gold':''}">${p.level==='Б'?'Базовый':p.level==='П'?'Повышенный':'Высокий'}</span><span class="pill">${p.points} балл(а)</span></div><span id="timer" class="timer ${isExam&&remaining<600?'danger':''}" data-end="${s.end||''}" data-start="${s.start}" data-exam="${isExam}">${label} ${time}</span></div><div class="progress-line"><div class="progress-fill" style="width:${pct(progress,s.ids.length)}%"></div></div><div class="q-number">ТИП №${q.pos} · ${safe(CATEGORIES[q.topic].name)}</div><div class="q-stem">${safe(q.prompt)}</div>${visualMarkup(q.visual)}${q.options?.length&&q.kind==='sequence'?`<div class="q-options">${q.options.map(x=>`<div style="color:#d3e0f2;border-bottom:1px solid #26374e;padding:8px 0;font-size:13px">${safe(x)}</div>`).join('')}</div>`:''}
${answerUi(q,s,locked)}${helper}${feedback}
<div class="q-actions">${isExam?`<button class="btn btn-ghost" data-action="exam-prev" ${s.index===0?'disabled':''}>${ico('back')} Назад</button><button class="btn btn-ghost" data-action="flag">${ico('flag')}${s.flags[q.id]?'Снять метку':'Отметить'}</button><span class="spacer"></span>${s.index===s.ids.length-1?`<button class="btn btn-primary" data-action="exam-finish">К проверке ${ico('arrow')}</button>`:`<button class="btn btn-primary" data-action="exam-next">Следующее ${ico('arrow')}</button>`}`:`${!checked?`<button class="btn btn-ghost" data-action="hint">${ico('bulb')} Подсказка</button><button class="btn btn-ghost" data-action="skip">Пропустить</button><span class="spacer"></span><button class="btn btn-primary" data-action="check-answer">${ico('check')} Проверить</button>`:`<span class="spacer"></span><button class="btn btn-primary" data-action="next-practice" ${!done?'disabled':''}>${s.index===s.ids.length-1?'Завершить':'Следующее задание'} ${ico('arrow')}</button>`}`}</div></div>
<div class="rail"><div class="card"><h3>${isExam?'Навигатор по варианту':'Прогресс сессии'}</h3><div class="question-mini-grid">${s.ids.map((id,i)=>`<button class="question-dot ${i===s.index?'active':''} ${isExam?(String(s.answers[id]||'').trim()?'done':''):s.awarded[id]!==undefined?'done':''} ${s.flags[id]?'flagged':''}" data-action="${isExam?'exam-goto':'noop'}" data-index="${i}" title="Задание ${i+1}">${i+1}</button>`).join('')}</div><div class="mini-rule"></div><p class="subtle">${progress}/${s.ids.length} ${isExam?'с ответами':'проверено'}</p><div class="progress-line"><div class="progress-fill" style="width:${pct(progress,s.ids.length)}%"></div></div></div><div class="card"><h3>${ico(isExam?'clock':'bulb')} ${isExam?'Режим экзамена':'Приём обучения'}</h3><p class="subtle">${isExam?'Таймер запущен на 180 минут. Развёрнутые решения оцени по критериям после завершения.':'Попробуй сначала восстановить формулу по смыслу величин. Не начинай с угадывания ответа.'}</p>${!isExam?`<button class="btn btn-sm btn-ghost" data-action="lesson" data-topic="${q.topic}">Повторить тему ${ico('arrow')}</button>`:''}</div><div class="reference">Формат №${q.pos}: ${safe(p.name)}. В базе авторский аналог экзаменационной позиции.</div></div></div>`}
function grading(){const s=db.active,writing=s.ids.map(id=>QBYID[id]).filter(q=>q.kind==='written');return `<div class="page-head"><div><div class="header-kicker">ПОСЛЕДНИЙ ЭТАП</div><h1>Самопроверка развёрнутых решений</h1><p>Краткие ответы будут оценены автоматически. Сверь каждую развёрнутую задачу с образцом и проставь баллы по учебным критериям.</p></div></div><div class="action-strip"><div class="accent">✎</div><div><strong>Важно: это самооценка</strong><p>Для реального экзамена эксперты учитывают полноту обоснования, рисунки, оформление и другие требования официальных критериев.</p></div></div><div class="exam-grading">${writing.map(q=>{const p=POS[q.pos],val=s.marks[q.id]??0;return `<div class="grade-panel"><div class="flex-between"><strong>№${q.pos} · ${safe(p.name)}</strong><span class="pill gold">Максимум ${p.points}</span></div><div class="q-stem" style="margin-top:15px">${safe(q.prompt)}</div><p><strong>Твой ответ:</strong> ${safe(s.answers[q.id]||'Не введён')}</p><div class="help-note"><strong>Образец решения:</strong> ${safe(q.solution)}</div><ol>${q.criteria.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><span class="subtle">Сколько баллов реально заслуживает твоё решение?</span><div class="grading-control">${Array.from({length:p.points+1},(_,i)=>`<button class="grade-button ${Number(val)===i?'active':''}" data-action="grade-exam" data-qid="${q.id}" data-score="${i}">${i}</button>`).join('')}</div></div>`}).join('')}</div><div style="margin-top:22px;display:flex;justify-content:end"><button class="btn btn-primary" data-action="exam-submit">Зафиксировать результат ${ico('arrow')}</button></div>`}
function result(){const r=ui.resultOverride||db.lastResult;if(!r)return `<div class="empty"><h3>Нет завершённых сессий</h3><button class="btn btn-primary" data-action="go" data-page="training">К тренировкам</button></div>`;let weak=r.scores.filter(x=>x.score<x.max),perfect=r.scores.filter(x=>x.score===x.max);return `<div class="result-hero card"><div class="header-kicker">СЕССИЯ ЗАВЕРШЕНА</div><div class="result-score">${r.earned}<span>/${r.total}</span></div><h1>${r.earned===r.total?'Идеально!':pct(r.earned,r.total)>=75?'Хороший результат!':'Каждая ошибка — подсказка для роста'}</h1><p>${modeName(r.mode)} · ${r.scores.length} заданий · ${Math.max(1,Math.ceil(r.duration/60))} мин · ${dateLabel(r.date)}</p><div class="hero-actions" style="justify-content:center"><button class="btn btn-primary" data-action="start" data-mode="adaptive">${ico('target')}Умная тренировка</button><button class="btn btn-ghost" data-action="go" data-page="analytics">Мой прогресс ${ico('arrow')}</button></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon">★</div><div class="stat-num">${pct(r.earned,r.total)}%</div><div class="stat-label">Доля набранных баллов</div></div><div class="stat-card"><div class="stat-icon">✓</div><div class="stat-num">${perfect.length}</div><div class="stat-label">Полностью верно</div></div><div class="stat-card"><div class="stat-icon">✕</div><div class="stat-num">${weak.length}</div><div class="stat-label">Повторить задания</div></div><div class="stat-card"><div class="stat-icon">◷</div><div class="stat-num">${Math.max(1,Math.ceil(r.duration/60))}</div><div class="stat-label">Минут работы</div></div></div><div class="card"><div class="card-title">Разбор выполненных заданий</div>${r.scores.map(x=>{const q=QBYID[x.id];return `<div class="review-row"><div class="review-top"><strong>№${q.pos} · ${safe(POS[q.pos].name)} <span style="color:#819ab2;font-size:11px">· ${x.id}</span></strong><span class="pill ${x.score===x.max?'green':x.score>0?'gold':'red'}">${x.score}/${x.max} б.</span></div><p>${safe(q.prompt)}</p><details><summary>Показать решение</summary><p><strong>Ответ:</strong> ${q.kind==='written'?'развёрнутый ответ':safe(q.answer)}. ${safe(q.solution)}</p></details></div>`}).join('')}</div><div class="action-strip" style="margin-top:20px"><div class="accent">◷</div><div><strong>Следующий шаг</strong><p>${weak.length?'Загляни в раздел ошибок и повтори сложные позиции после небольшого перерыва.':'Закрепляй успешные решения по интервальному расписанию.'}</p></div><button class="btn btn-ghost" data-action="go" data-page="review">Мои ошибки</button></div>${sourceFooter()}`}
function render(){const renderers={dashboard:overview,training,catalog,learn:learning,lesson,analytics,review,settings,session,result};const page=renderers[ui.page]?ui.page:'dashboard';const html=renderers[page]();app.innerHTML=`<div class="app-shell">${navbar()}<main class="main">${header()}${html}</main></div>${mobileNav()}`;updateTimer()}
function updateTimer(){const el=document.querySelector('#timer');if(!el)return;const exam=el.dataset.exam==='true',s=exam?Math.floor((Number(el.dataset.end)-Date.now())/1000):Math.floor((Date.now()-Number(el.dataset.start))/1000);el.textContent=(exam?'Осталось ':'Прошло ')+fmtTime(s);if(exam&&s<600)el.classList.add('danger');if(exam&&s<=0&&db.active?.phase==='answer'){examToGrading();notify('Время экзамена истекло. Перейди к самооценке развёрнутых решений.')}}
setInterval(updateTimer,1000);
function questionAnswer(value){const s=db.active;if(!s||s.phase!=='answer')return;const q=QBYID[s.ids[s.index]];if(s.mode!=='exam'&&s.checked[q.id])return;s.answers[q.id]=value;persist()}
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-answer]'))questionAnswer(el.value);if(el.matches('[data-filter="search"]')){ui.search=el.value;const node=document.querySelector('#catalog-items');if(node)node.innerHTML=catalogItems(POSITIONS.filter(p=>p.name.toLowerCase().includes(ui.search.toLowerCase())||String(p.num)===ui.search.trim()))}});
document.addEventListener('change',async e=>{let el=e.target;if(el.matches('[data-filter]')){const key=el.dataset.filter;if(key==='topic')ui.topic=el.value;if(key==='position')ui.position=el.value;if(key==='count')ui.count=el.value}if(el.id==='import-file'&&el.files?.[0]){try{const file=el.files[0];if(file.size>8e6)throw Error('Файл слишком большой.');const data=JSON.parse(await file.text());if(!Array.isArray(data.attempts)||!Array.isArray(data.sessions)||!data.reviews||typeof data.reviews!=='object')throw Error('Неподдерживаемый формат резервной копии.');if(window.confirm('Заменить текущую статистику данными из резервной копии?')){db={...DEFAULT(),...data};db.active=null;persist();ui.resultOverride=null;go('dashboard');notify('Прогресс успешно восстановлен.')}}catch(err){notify('Не удалось импортировать: '+err.message)}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.tagName==='A')e.preventDefault();const a=b.dataset.action,s=db.active,q=s?.phase==='answer'?QBYID[s.ids[s.index]]:null;
 if(a==='go'){ui.resultOverride=null;go(b.dataset.page);return}
 if(a==='start'){start(b.dataset.mode||'adaptive',{topic:b.dataset.topic,pos:b.dataset.pos,count:b.dataset.count});return}
 if(a==='custom'){start('custom',{topic:ui.topic,pos:ui.position,count:ui.count});return}
 if(a==='lesson'){ui.learnTopic=b.dataset.topic;go('lesson');return}
 if(a==='pick-answer'&&q){const v=b.dataset.value,cur=String(s.answers[q.id]||'');let next=q.kind==='multi'?(cur.includes(v)?cur.replace(v,''):[...cur.split(''),v].sort().join('')):v;if(q.kind==='multi'&&next.length>2){notify('Нужно выбрать ровно два утверждения.');return}questionAnswer(next);render();return}
 if(a==='hint'&&q){s.hints[q.id]=true;persist();render();return}
 if(a==='check-answer'){checkPractice();return}
 if(a==='skip'){nextPractice(true);return}
 if(a==='next-practice'){nextPractice(false);return}
 if(a==='grade-practice'){gradePractice(Number(b.dataset.score));return}
 if(a==='end-training'){if(window.confirm('Завершить сессию сейчас? Непройденные задания не будут засчитаны.'))finalSession();return}
 if(a==='exam-next'&&s){s.index=Math.min(s.index+1,s.ids.length-1);persist();render();return}
 if(a==='exam-prev'&&s){s.index=Math.max(s.index-1,0);persist();render();return}
 if(a==='exam-goto'&&s){s.index=Number(b.dataset.index);persist();render();return}
 if(a==='flag'&&s){s.flags[q.id]=!s.flags[q.id];persist();render();return}
 if(a==='exam-finish'){if(window.confirm('Закончить работу с вариантом и перейти к самооценке развёрнутых заданий?'))examToGrading();return}
 if(a==='grade-exam'&&s){s.marks[b.dataset.qid]=Number(b.dataset.score);persist();render();return}
 if(a==='exam-submit'){if(window.confirm('Завершить проверку и сохранить результат пробного ОГЭ?'))finishExam();return}
 if(a==='history-result'){ui.resultOverride=db.sessions.find(x=>x.id===b.dataset.id)||null;go('result');return}
 if(a==='save-settings'){db.name=(document.querySelector('#student-name')?.value.trim()||'Ученик').slice(0,32);db.goal=Number(document.querySelector('#student-goal')?.value)||10;persist();go('settings');notify('Настройки сохранены.');return}
 if(a==='export'){const blob=new Blob([JSON.stringify({...db,active:null},null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='oge-physics-progress-'+localDate()+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(a==='reset'){if(window.confirm('Точно удалить весь локальный прогресс? Это нельзя отменить.')){db=DEFAULT();persist();ui.resultOverride=null;go('dashboard');notify('Локальные данные сброшены.')}return}
});
render();
})();

</script>
</body>
